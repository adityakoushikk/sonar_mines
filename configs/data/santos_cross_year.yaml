# Cross-year split of the Santos 2024 dataset, used for Experiment 3
# (generalization across collection years). Train on the historical bulk
# (2010, 2015, 2017, 2018) and hold out 2021 as the newest year.

name: "santos_cross_year"
root: "${oc.env:PROJECT_ROOT,.}/data/santos"
images_dir: "images"
labels_dir: "labels"
class_names:
  - "MILCO"
  - "NOMBO"

split:
  kind: "cross_year"
  train_years: [2010, 2015, 2017, 2018]
  test_years: [2021]
  val_frac_of_train: 0.15
  seed: ${seed}

subsample_n: null
