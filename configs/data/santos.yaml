# Santos et al. 2024 side-scan sonar dataset.
# 1170 SSS images total; 304 with bounding-box annotations covering 668 objects
# in 2 classes (MILCO, NOMBO). Random split for Experiments 1, 2, 4.

name: "santos"
root: "${oc.env:PROJECT_ROOT,.}/data/santos"
images_dir: "images"
labels_dir: "labels"
class_names:
  - "MILCO"
  - "NOMBO"

# Random split used for the default experiments
split:
  kind: "random"
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
  seed: ${seed}

# Optional: subsample to N annotated images for low-data ablations
subsample_n: null
